[project]
name = "ripple_tradePilot"
version = "0.5.0"
description = "Wave trading system with shared strategy core"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Ripple" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial :: Investment",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "tushare>=1.2",
  "akshare>=1.10",
  "pyyaml>=6.0",
  # mx_loader 直接 import requests，此前靠 tushare/akshare 传递依赖侥幸可用
  "requests>=2.31",
  "httpx[socks]>=0.24",
  "click>=8.0",
  # ML 信号质量模型（D 阶段，懒加载）：训练/校准用工，import 全部惰性化，
  # 未安装时 dashboard/monitor 的信号链路照常运行（仅 ml train/promote 报清晰错误）。
  "scikit-learn>=1.4,<1.7",
  "joblib>=1.3",
]

[project.scripts]
tradepilot = "ripple_tradePilot.cli:cli"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ripple_tradePilot.api" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# P7 首批（先宽后紧）：语法/未定义名/未用导入/裸 print。
# 收紧（完整 E/W/I/UP/B 等）待 print→logger 与命名清理完成后再做。
select = ["E4", "E7", "E9", "F", "T201"]

[tool.ruff.lint.per-file-ignores]
# 永久 facade：整个文件的存在意义就是 re-export，"未使用导入"是功能不是问题
"src/ripple_tradePilot/storage/database.py" = ["F401"]
# __main__ 是 CLI 入口，print 即用户界面
"src/ripple_tradePilot/storage/__main__.py" = ["T201"]
# importlib 显式取模块本体的打桩手法在注释之后，import 位置是刻意的
"tests/test_market_overview.py" = ["E402"]

[tool.mypy]
# P7 渐进类型检查：只查 P5 拆分后最干净的域，先不 block CI
files = ["src/ripple_tradePilot/storage", "src/ripple_tradePilot/signals"]
ignore_missing_imports = true
explicit_package_bases = true
check_untyped_defs = true
